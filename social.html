<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social - Xander Herdia-Leon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="social-container">

  <!-- PROFILE -->
  <img src="https://res.cloudinary.com/dovrzmlqj/image/upload/v1776844074/img-home-6_rhleyv.webp" class="profile-img">

  <h1 class="name">Xander Herdia-Leon</h1>

  <!-- ICON ROW -->
  <div class="icon-row">

    <a href="https://www.facebook.com/" class="icon-img-btn">
      <img src="https://res.cloudinary.com/dovrzmlqj/image/upload/v1776986363/facebook_m1jbkn.png">
    </a>

    <a href="https://instagram.com/vzxayy" class="icon-img-btn center-icon">
      <img src="https://res.cloudinary.com/dovrzmlqj/image/upload/v1776986362/instagram_lltesz.png">
    </a>

    <a href="https://discord.com/" class="icon-img-btn">
      <img src="https://res.cloudinary.com/dovrzmlqj/image/upload/v1776986667/discord_o2ujkt.png">
    </a>

  </div>

  <!-- BUTTON STACK -->
  <div class="button-stack">

    <a href="https://www.tiktok.com/@xayyleon" class="big-img-btn">
      <img src="https://res.cloudinary.com/dovrzmlqj/image/upload/v1776986668/tiktok_bx9k4v.png">
    </a>

    <a href="https://x.com/" class="big-img-btn">
      <img src="https://res.cloudinary.com/dovrzmlqj/image/upload/v1776986366/twitter_zv0bkp.png">
    </a>

    <a href="https://www.youtube.com/" class="big-img-btn">
      <img src="https://res.cloudinary.com/dovrzmlqj/image/upload/v1776986362/youtube_leqgt7.png">
    </a>

    <a href="https://www.amazon.com/" class="big-img-btn">
      <img src="https://res.cloudinary.com/dovrzmlqj/image/upload/v1776986365/amazon_bolp4d.png">
    </a>

    <a href="https://cash.app/" class="big-img-btn">
      <img src="https://res.cloudinary.com/dovrzmlqj/image/upload/v1776986364/cashapp_fkc1aq.png">
    </a>

  </div>

</div>

<!-- INTERACTIONS -->
<script>
document.querySelectorAll('.icon-img-btn, .big-img-btn').forEach(el => {

  // PARALLAX
  el.addEventListener('mousemove', (e) => {
    const rect = el.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    const rotateX = ((y / rect.height) - 0.5) * -10;
    const rotateY = ((x / rect.width) - 0.5) * 10;

    el.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
  });

  el.addEventListener('mouseleave', () => {
    el.style.transform = 'rotateX(0) rotateY(0) scale(1)';
  });

  // RIPPLE
  el.addEventListener('click', function(e) {
    const circle = document.createElement("span");
    const d = Math.max(this.clientWidth, this.clientHeight);

    circle.style.width = circle.style.height = d + "px";
    circle.style.left = e.offsetX - d/2 + "px";
    circle.style.top = e.offsetY - d/2 + "px";

    circle.classList.add("ripple");
    this.appendChild(circle);

    setTimeout(() => circle.remove(), 600);
  });

});
</script>

</body>
</html>
